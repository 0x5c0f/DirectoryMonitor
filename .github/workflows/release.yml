name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test
      - name: Run clippy
        run: cargo clippy -- -D warnings

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            platform: linux
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
            platform: macos
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            platform: windows
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tarball)
        if: matrix.platform != 'windows'
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DIST_NAME="directory-monitor-${VERSION}-${matrix.platform}-${matrix.arch}"
          mkdir -p "${DIST_NAME}"
          cp target/${{ matrix.target }}/release/directory-monitor${{ matrix.ext }} "${DIST_NAME}/"
          cp config.example.toml "${DIST_NAME}/config.toml"
          cp README.md "${DIST_NAME}/"
          tar -czf "${DIST_NAME}.tar.gz" "${DIST_NAME}"

      - name: Package (zip)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DIST_NAME="directory-monitor-${VERSION}-${matrix.platform}-${matrix.arch}"
          mkdir -p "${DIST_NAME}"
          cp target/${{ matrix.target }}/release/directory-monitor${{ matrix.ext }} "${DIST_NAME}/"
          cp config.example.toml "${DIST_NAME}/config.toml"
          cp README.md "${DIST_NAME}/"
          7z a "${DIST_NAME}.zip" "${DIST_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: directory-monitor-*-${{ matrix.platform }}-${{ matrix.arch }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine prerelease
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if echo "$TAG" | grep -qE 'rc\.[0-9]+$'; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Directory Monitor ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: release-files/*

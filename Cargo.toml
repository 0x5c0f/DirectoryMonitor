[workspace]
resolver = "2"
members = [
    "crates/dm-core",
    "crates/dm-watcher",
    "crates/dm-processor",
    "crates/dm-storage",
    "crates/dm-notify",
    "crates/dm-metrics",
    "crates/dm-web",
    "crates/dm-cli",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
# Core
dm-core = { path = "crates/dm-core" }
dm-watcher = { path = "crates/dm-watcher" }
dm-processor = { path = "crates/dm-processor" }
dm-storage = { path = "crates/dm-storage" }
dm-notify = { path = "crates/dm-notify" }
dm-web = { path = "crates/dm-web" }
dm-metrics = { path = "crates/dm-metrics" }

# Web framework
axum = { version = "0.8", features = ["ws"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# File system monitoring
notify = "7"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Email
lettre = { version = "0.11", features = ["smtp-transport", "tokio1-native-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Glob pattern matching
globset = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }

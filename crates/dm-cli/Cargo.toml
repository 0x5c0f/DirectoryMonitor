[package]
name = "dm-cli"
description = "CLI entry point for Directory Monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "directory-monitor"
path = "src/main.rs"

[dependencies]
dm-core = { workspace = true }
dm-cluster = { workspace = true }
dm-metrics = { workspace = true }
dm-watcher = { workspace = true }
dm-processor = { workspace = true }
dm-storage = { workspace = true }
dm-notify = { workspace = true }
dm-web = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio-stream = "0.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directory Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Critical: prevent flash of login page before auth check */
body { margin: 0; }
body.theme-dark { background: #060a14; }
body.theme-light { background: #f5f6f8; }
#loginPage, #mainPage { display: none; }
#loadingScreen {
  position: fixed; inset: 0; z-index: 9998;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px;
  transition: opacity 0.25s ease-out;
}
#loadingScreen.fade-out { opacity: 0; pointer-events: none; }
.theme-dark #loadingScreen { background: #060a14; }
.theme-light #loadingScreen { background: #f5f6f8; }
.loading-spinner {
  width: 32px; height: 32px;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
.theme-dark .loading-spinner { border: 3px solid #1a2844; border-top-color: #f0a030; }
.theme-light .loading-spinner { border: 3px solid #d8dce4; border-top-color: #c07800; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
}
.theme-dark .loading-text { color: #4a5a72; }
.theme-light .loading-text { color: #8a90a0; }
</style>
<script>
// Apply saved theme immediately to prevent flash and match loading screen
(function() {
  var t = localStorage.getItem('dm_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  document.body.className = 'theme-' + t;
})();
</script>
<style>{style}</style>
</head>
<body class="theme-dark">
{markup}
<script>
{script}
</script>
</body>
</html>

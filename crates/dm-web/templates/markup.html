<!-- ── Loading Screen (removed after auth check) ─── -->
<div id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Directory Monitor</div>
</div>

<!-- ── Modal Container ─────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- ── Login Page ──────────────────────────────────── -->
<div id="loginPage">
  <div class="login-theme-toggle">
    <button class="btn-icon" id="loginThemeBtn" title="切换主题">
      <svg id="loginThemeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </div>
  <div class="login-box">
    <div class="login-header">
      <div class="login-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--amber)">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
      </div>
      <h2>Directory Monitor</h2>
      <p>输入访问密码以继续</p>
    </div>
    <div class="login-input-group">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input type="password" id="loginPassword" placeholder="密码" autofocus>
    </div>
    <button id="loginBtn">进入系统</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ── Main Page ───────────────────────────────────── -->
<div id="mainPage">
  <header>
    <div class="logo">
      <div class="logo-mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--amber)">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <span class="logo-text">Directory Monitor</span>
    </div>
    <div class="nav-tabs">
      <button class="active" data-tab="events">事件日志</button>
      <button data-tab="settings">监控配置</button>
    </div>
    <div class="header-right">
      <div class="status-badge">
        <span class="dot" id="dot"></span>
        <span id="statusText">离线</span>
      </div>
      <span class="stats" id="stats"></span>
      <button class="btn-icon" id="themeBtn" title="切换主题">
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <button class="btn-icon" id="logoutBtn" title="退出登录">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Events Tab -->
  <div class="tab-content active" id="tab-events">
    <div class="toolbar">
      <div class="search-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search" placeholder="搜索路径...">
      </div>
      <div class="checkbox-dropdown" id="typeFilterDropdown">
        <button class="checkbox-dropdown-btn" id="typeFilterBtn" aria-haspopup="listbox" aria-expanded="false">
          <span id="typeFilterLabel">所有类型</span>
          <svg class="arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="checkbox-dropdown-panel" role="listbox" aria-multiselectable="true">
          <div class="checkbox-dropdown-header">
            <button onclick="selectAllTypes()" type="button">全选</button>
            <button onclick="clearAllTypes()" type="button">清除</button>
          </div>
          <div id="typeCheckboxes"></div>
        </div>
      </div>
      <span class="count" id="count">0 条事件</span>
    </div>
    <div class="event-list" id="list">
      <div class="empty-msg">
        <div class="empty-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted)">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        等待文件系统事件...
      </div>
    </div>
    <div class="pagination" id="pagination" style="display:none">
      <button id="btn-first" onclick="goToPage(1)" disabled>首页</button>
      <button id="btn-prev" onclick="goToPage(currentPage - 1)" disabled>上一页</button>
      <span class="page-info"><input type="number" id="page-jump-input" class="page-input" min="1" onkeydown="if(event.key==='Enter')jumpToPage()" onchange="jumpToPage()"> / <span id="total-pages">1</span> (<span id="total-count">0</span> 条)</span>
      <button id="btn-next" onclick="goToPage(currentPage + 1)" disabled>下一页</button>
      <button id="btn-last" onclick="goToPage(totalPages)" disabled>末页</button>
    </div>
  </div>

  <!-- Settings Tab -->
  <div class="tab-content" id="tab-settings">
    <div class="settings-panel" id="settingsPanel">
      <div class="empty-msg">加载中...</div>
    </div>
  </div>
</div>

[package]
name = "dm-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Web server for Directory Monitor"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

dm-core = { path = "../dm-core" }
dm-processor = { path = "../dm-processor" }
dm-storage = { path = "../dm-storage" }
dm-watcher = { path = "../dm-watcher" }

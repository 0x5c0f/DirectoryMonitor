[package]
name = "dm-web"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "Web server for Directory Monitor"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

dm-core = { path = "../dm-core" }
dm-metrics = { path = "../dm-metrics" }
dm-processor = { path = "../dm-processor" }
dm-storage = { path = "../dm-storage" }
dm-watcher = { path = "../dm-watcher" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
toml = "0.8"
tempfile = "3"
